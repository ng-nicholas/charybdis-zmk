# enable display drivers
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n # Optional: Show dongle battery level (disabled - USB powered)
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y # Optional: WPM meter
CONFIG_ZMK_IDLE_TIMEOUT=300000 # Display timeout - 5 minutes (300000 milliseconds)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2147483647 # Disable sleep timeout
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y

#EXT POWER
CONFIG_ZMK_EXT_POWER=y

#BLE-passkey
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

#BLE-clean
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# Enable mouse support
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# 3 profiles (n+2)
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Split central (dongle acts as central/receiver)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# CONFIG_BT_BAS=n

# Enable SPI
CONFIG_SPI=y


