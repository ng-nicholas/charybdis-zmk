# Sets Bluetooth transmit power to +8 dBm for better range and reliability.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sets battery report interval to 60 seconds.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Enable display support and battery indicator on dongle display.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y